name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run local quality contract
        run: ./scripts/quality_gate.sh
