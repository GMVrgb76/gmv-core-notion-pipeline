name: quality-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: macos-latest
    env:
      # On the maintainer's own machine ~/.gmv_core *is* the checkout, so
      # GMV_CORE_ROOT-consuming scripts (e.g. 10_API/gmv_artist_import.py)
      # resolve correctly without an override. The CI runner has no such
      # directory, so it must be pointed at this job's actual checkout path.
      GMV_CORE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run local quality contract
        run: ./scripts/quality_gate.sh
