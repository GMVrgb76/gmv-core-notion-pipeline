[build-system]
requires = [
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "gmv-core"
version = "2.0.0a0"
description = "Local core of the GMV Master System"
readme = "README_CORE.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.setuptools]
packages = ["gmv_core"]
include-package-data = false

[tool.setuptools.package-data]
gmv_core = ["migration_sql/*.sql"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]
# E701/E702 (multiple statements on one line) conflict with this codebase's
# established dense one-liner style, used throughout since before this
# select list existed. Not enforced going forward; F/S/E4/E9/other-E7 stay active.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603"]
"01_RUNTIME/knowledge_engine.py" = ["E401"]
"01_RUNTIME/legacy_inventory.py" = ["E401", "F401"]
"10_API/gmv_compatibility.py" = ["E401", "F401", "S602"]
"10_API/import_service.py" = ["S608"]
"10_API/plugin_manager.py" = ["E401"]
"gmv_core/repositories/queue.py" = ["S608"]
# Thin CLI wrappers, same single-line stdlib-import style already whitelisted above.
"10_API/gmv_content_extract.py" = ["E401"]
"10_API/gmv_entity_resolve.py" = ["E401"]
"10_API/gmv_evidence_index.py" = ["E401"]
"10_API/gmv_notion_candidate.py" = ["E401"]
"10_API/gmv_semantic_extract.py" = ["E401"]
# sys.path.insert(...) must run before the sibling-module import that depends on it
# (no installed package here — pyproject.toml has dependencies = []).
"10_API/gmv_notion_publish.py" = ["E402"]
"10_API/gmv_review_server.py" = ["E402"]
"10_API/pipeline_status.py" = ["E402"]
"tests/test_gmv_evidence_pipeline.py" = ["E402"]
"tests/test_gmv_notion_multi_candidate.py" = ["E402"]
"tests/test_gmv_notion_publish.py" = ["E402"]
"tests/test_gmv_review_server.py" = ["E402"]
"tests/test_pipeline_status.py" = ["E402"]
